# Android release pipeline: signed APK + AAB on every push to main,
# GitHub Release attached on version tags (v*).
# Secrets required: ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
# Keep APP_VERSION in sync with android/app/build.gradle.kts versionName.
name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - "web/public/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

env:
  APP_VERSION: 1.0.3
  GRADLE_VERSION: 8.7

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Restore release keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/ci-release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Verify assetlinks fingerprint matches keystore
        run: |
          FP=$(keytool -list -v -keystore android/ci-release.keystore -storepass "$KEYSTORE_PASSWORD" 2>&1 | grep -o 'SHA256:.*' | tr -d ': ' | sed 's/SHA256//')
          echo "keystore SHA256: $FP"
          grep -q "$FP" web/public/.well-known/assetlinks.json || (echo "assetlinks.json missing CI fingerprint" && exit 1)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Install Gradle
        run: |
          curl -sSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build signed APK + AAB
        run: /tmp/gradle-${GRADLE_VERSION}/bin/gradle assembleRelease bundleRelease --no-daemon
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/ci-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/qaf-support-${APP_VERSION}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/qaf-support-${APP_VERSION}.aab"
          ls -la dist
        working-directory: android

      - name: Upload APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: qaf-support-${{ env.APP_VERSION }}-android
          path: android/dist/*

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "${GITHUB_REF_NAME}" android/dist/* \
            --title "QAF Support ${GITHUB_REF_NAME}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
